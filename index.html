<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14252a"><title>Adventsatelier · 2026</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#364d50,#12242b 65%);min-height:100vh;color:#fff5df;font:16px/1.5 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:clamp(18px,5vw,56px)}h1{font:normal clamp(42px,8vw,78px)/1 Georgia;margin:.25em 0 .45em}small{letter-spacing:.15em;color:#e6c990}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}a{color:inherit}nav a{display:block;background:#20363b;padding:20px;border:1px solid #60726d;border-radius:12px;text-decoration:none}nav a:hover,nav a:focus-visible{border-color:#f5cf87;background:#31484a}strong,span{display:block}strong{font:26px Georgia;margin:.4em 0}span{color:#e0dfd2}#preview{background:#101b24}#preview header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:8px 12px;background:#20363b;color:#fff4df}button,select{font:inherit;background:#20363b;color:inherit;border:1px solid #879492;padding:8px;border-radius:7px;max-width:52%}iframe{display:block;border:0;width:100%;height:calc(100vh - 58px);height:calc(100dvh - 58px)}[hidden]{display:none!important}</style><main id="list"><small>WINTER 2026</small><h1>Adventsatelier</h1><nav aria-label="Kalender"><a href="../Emilias-Adventskalender/" data-key="Emilias"><b aria-hidden="true">⚽</b><strong>Emilia</strong><span>Ronaldos Weihnachtsgeheimnis</span></a><a href="../Mamas-Adventskalender/" data-key="Mamas"><b aria-hidden="true">🚂</b><strong>Christel</strong><span>Das große Weihnachtsabenteuer</span></a><a href="../Francescas-Adventskalender/" data-key="Francescas"><b aria-hidden="true">🦄</b><strong>Francesca</strong><span>Das Geheimnis des magischen Dorfes</span></a><a href="../Marcos-Adventskalender/" data-key="Marcos"><b aria-hidden="true">🎮</b><strong>Marco</strong><span>Fußball & Gaming Challenge</span></a><a href="../Wuenschewesens-Adventskalender/" data-key="Wuenschewesens"><b aria-hidden="true">🗝️</b><strong>Wimmelbild</strong><span>Das Atelier der kleinen Wunder</span></a></nav></main><section id="preview" hidden><header><button id="back">Alle Kalender</button><select id="picker" aria-label="Kalender wechseln"></select></header><iframe id="game" title="Kalendervorschau" allow="autoplay"></iframe></section><script>const links=Array.from(document.querySelectorAll('nav a'));const list=document.querySelector('main'),preview=document.querySelector('section'),picker=document.querySelector('select'),game=document.querySelector('iframe');for(const link of links){picker.add(new Option(link.querySelector('strong').textContent,link.dataset.key));link.onclick=e=>{if(e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();location.hash=link.dataset.key}}function render(){const link=links.find(a=>a.dataset.key===location.hash.slice(1));list.hidden=!!link;preview.hidden=!link;game.src=link?link.href:'about:blank';if(link){picker.value=link.dataset.key;game.title=link.textContent.trim();picker.focus()}window.scrollTo(0,0)}picker.onchange=()=>location.hash=picker.value;document.getElementById('back').onclick=()=>location.hash='';window.addEventListener('hashchange',render);render()</script></html>
